version: v2
inputs:
  # Review-time source: depot/proto#63. Replace with its published BSR revision before merge.
  - git_repo: https://github.com/depot/proto.git
    ref: fc88f5539b20dee160b69f58753a32eadc3fcaac
    subdir: proto
    paths:
      - depot/core/v1/usage_analytics.proto
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/depot/cli/pkg/proto
plugins:
  - remote: buf.build/protocolbuffers/go:v1.31.0
    out: pkg/proto
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.11.1
    out: pkg/proto
    opt: paths=source_relative
