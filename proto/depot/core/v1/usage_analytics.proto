syntax = "proto3";

package depot.core.v1;

import "google/protobuf/timestamp.proto";

// Read-only usage series and breakdowns for an organization. Every method covers only the calling organization.
service UsageAnalyticsService {
  // Returns daily container build usage and layer cache storage for one project.
  rpc GetProjectUsageSeries(GetProjectUsageSeriesRequest) returns (GetProjectUsageSeriesResponse) {}
  // Returns daily usage for each product in the organization, with totals for the period.
  rpc GetOrganizationUsageSeries(GetOrganizationUsageSeriesRequest) returns (GetOrganizationUsageSeriesResponse) {}
  // Returns container build usage grouped by project.
  rpc ListContainerBuildUsageByProject(ListContainerBuildUsageByProjectRequest) returns (ListContainerBuildUsageByProjectResponse) {}
  // Returns GitHub Actions job usage grouped by repository.
  rpc ListGithubActionsUsageByRepository(ListGithubActionsUsageByRepositoryRequest) returns (ListGithubActionsUsageByRepositoryResponse) {}
  // Returns GitHub Actions job usage grouped by runner label.
  rpc ListGithubActionsUsageByRunner(ListGithubActionsUsageByRunnerRequest) returns (ListGithubActionsUsageByRunnerResponse) {}
  // Returns GitHub Actions job usage grouped by repository, workflow, and job name.
  rpc ListGithubActionsUsageByJob(ListGithubActionsUsageByJobRequest) returns (ListGithubActionsUsageByJobResponse) {}
  // Returns Depot CI job attempt usage grouped by repository.
  rpc ListDepotCIUsageByRepository(ListDepotCIUsageByRepositoryRequest) returns (ListDepotCIUsageByRepositoryResponse) {}
  // Returns Depot CI job attempt usage grouped by repository and workflow.
  rpc ListDepotCIUsageByWorkflow(ListDepotCIUsageByWorkflowRequest) returns (ListDepotCIUsageByWorkflowResponse) {}
  // Returns test results usage grouped by repository.
  rpc ListTestResultsUsageByRepository(ListTestResultsUsageByRepositoryRequest) returns (ListTestResultsUsageByRepositoryResponse) {}
  // Returns the rows of the usage report CSV export as structured data.
  rpc GetUsageReport(GetUsageReportRequest) returns (GetUsageReportResponse) {}
  // Returns agent sandbox compute time per day, the number of running sandboxes, and recent sandbox durations.
  rpc GetAgentSandboxUsage(GetAgentSandboxUsageRequest) returns (GetAgentSandboxUsageResponse) {}
  // Returns usage totals for the organization's current usage period.
  rpc GetCurrentPeriodUsage(GetCurrentPeriodUsageRequest) returns (GetCurrentPeriodUsageResponse) {}
}

// Time window for a usage request. Days are calendar days in UTC.
message UsageAnalyticsTimeRange {
  // Inclusive start of the window, in RFC 3339 format. Default: the start of the current calendar month in UTC.
  google.protobuf.Timestamp start_at = 1;
  // Exclusive end of the window, in RFC 3339 format. Must be after `startAt`. The window can be at most 93 days long.
  // Default: the current time.
  google.protobuf.Timestamp end_at = 2;
}

message GetProjectUsageSeriesRequest {
  // Unique identifier for the project. Returned by `ListProjects` and `GetProject`.
  string project_id = 1;
  // Time window to report. To see one month, set `startAt` to the first day of the month and `endAt` to the first day
  // of the next month.
  UsageAnalyticsTimeRange time_range = 2;
}

// Container build totals for a project or organization.
message ContainerBuildUsageTotals {
  // Number of builds that finished in the window.
  int64 build_count = 1;
  // Number of builds that did not end with an error.
  int64 successful_build_count = 2;
  // Number of builds that ended with an error.
  int64 failed_build_count = 3;
  // Total build duration, in seconds. This is the build time Depot bills.
  double billable_seconds = 4;
  // Build time saved by cache hits, in seconds.
  double saved_seconds = 5;
}

message ProjectUsageDay {
  // Calendar day in UTC, in "YYYY-MM-DD" format.
  string date = 1;
  // True when the day has not ended yet or is only partly inside the window.
  bool partial = 2;
  // Container builds that finished on this day.
  ContainerBuildUsageTotals builds = 3;
  // Average layer cache storage used on this day, in GB.
  double layer_cache_gb = 4;
}

message GetProjectUsageSeriesResponse {
  // Unique identifier for the project.
  string project_id = 1;
  // Inclusive start of the window, in RFC 3339 format.
  google.protobuf.Timestamp period_start = 2;
  // Exclusive end of the window, in RFC 3339 format.
  google.protobuf.Timestamp period_end = 3;
  // Container build totals for the whole window.
  ContainerBuildUsageTotals totals = 4;
  // One entry for each day in the window, in date order. Days without usage have zero values.
  repeated ProjectUsageDay days = 5;
}

message GetOrganizationUsageSeriesRequest {
  // An array of products to include. Can be "container-builds", "github-actions", "depot-ci", "test-results", "storage", or "agent-sandboxes".
  // Unselected product messages are omitted. Leave empty to include every supported product.
  repeated string products = 2;
  // Time window to report. To see one month, set `startAt` to the first day of the month and `endAt` to the first day
  // of the next month.
  UsageAnalyticsTimeRange time_range = 1;
}

// GitHub Actions job totals.
message GithubActionsUsageTotals {
  // Number of jobs that finished in the window.
  int64 job_count = 1;
  // Number of jobs that ended with the "success" conclusion.
  int64 successful_job_count = 2;
  // Number of jobs that failed.
  int64 failed_job_count = 3;
  // Billable job time, in seconds.
  double billable_seconds = 4;
  // Elapsed job time, in seconds.
  double elapsed_seconds = 5;
}

// Depot CI job attempt totals.
message DepotCIUsageTotals {
  // Number of job attempts that finished in the window.
  int64 attempt_count = 1;
  // Number of attempts with the "success" outcome.
  int64 successful_attempt_count = 2;
  // Number of attempts with the "failure" outcome.
  int64 failed_attempt_count = 3;
  // Number of attempts with any other outcome, such as "cancelled" or "skipped".
  int64 other_attempt_count = 4;
  // Compute time used, in vCPU-seconds.
  double vcpu_seconds = 5;
  // Elapsed attempt time, in seconds.
  double elapsed_seconds = 6;
}

// Daily test results counts.
message TestResultsUsageDay {
  // Number of tests reported from Depot CI jobs.
  int64 depot_ci_test_count = 1;
  // Number of tests reported from GitHub Actions jobs.
  int64 github_actions_test_count = 2;
  // Number of tests reported from all sources.
  int64 total_test_count = 3;
}

// Test results totals.
message TestResultsUsageTotals {
  // Number of test reports received in the window.
  int64 report_count = 1;
  // Number of tests in those reports.
  int64 test_count = 2;
  // Number of billable tests. Tests received before August 1, 2026 are never billable.
  int64 billable_test_count = 3;
}

// Agent sandbox totals.
message AgentSandboxUsageTotals {
  // Number of sandbox sessions that completed in the window.
  int64 session_count = 1;
  // Number of sessions that finished normally.
  int64 finished_session_count = 2;
  // Number of sessions that failed.
  int64 failed_session_count = 3;
  // Total session duration, in seconds.
  double billable_seconds = 4;
}

// Daily storage and transfer values, excluding Depot Registry storage.
message StorageUsageDay {
  // Total layer cache storage used across projects, in GB. Each project's daily average is summed.
  double layer_cache_gb = 1;
  // Average remote build cache storage used, in GB.
  double remote_build_cache_gb = 2;
  // Data transferred out of the Depot Registry, in bytes.
  int64 registry_data_transfer_bytes = 3;
}

// Storage and transfer totals, excluding Depot Registry storage.
message StorageUsageTotals {
  // Average daily layer cache storage across the days in the window that have started, rounded to whole GB.
  int64 layer_cache_gb = 1;
  // Average daily remote build cache storage across the days in the window that have started, rounded to whole GB.
  int64 remote_build_cache_gb = 2;
  // Data transferred out of the Depot Registry in the window, in bytes.
  int64 registry_data_transfer_bytes = 3;
}

message OrganizationUsageDay {
  // Calendar day in UTC, in "YYYY-MM-DD" format.
  string date = 1;
  // True when the day has not ended yet or is only partly inside the window.
  bool partial = 2;
  // Container builds that finished on this day.
  ContainerBuildUsageTotals container_builds = 3;
  // GitHub Actions jobs that finished on this day.
  GithubActionsUsageTotals github_actions = 4;
  // Depot CI job attempts that finished on this day. Zero before May 22, 2026, when Depot CI usage tracking started.
  DepotCIUsageTotals depot_ci = 5;
  // Tests reported on this day. Zero before July 22, 2026, when test results usage tracking started.
  TestResultsUsageDay test_results = 6;
  // Storage and transfer on this day.
  StorageUsageDay storage = 7;
  // Agent sandbox sessions that completed on this day.
  AgentSandboxUsageTotals agent_sandboxes = 8;
}

message OrganizationUsageTotals {
  // Container build totals.
  ContainerBuildUsageTotals container_builds = 1;
  // GitHub Actions job totals.
  GithubActionsUsageTotals github_actions = 2;
  // Depot CI job attempt totals. Only covers usage from May 22, 2026 onward.
  DepotCIUsageTotals depot_ci = 3;
  // Test results totals. Only covers usage from July 22, 2026 onward.
  TestResultsUsageTotals test_results = 4;
  // Storage and transfer totals.
  StorageUsageTotals storage = 5;
  // Agent sandbox totals.
  AgentSandboxUsageTotals agent_sandboxes = 6;
}

message GetOrganizationUsageSeriesResponse {
  // Coverage and attribution limitations for each selected product. Inspect this before treating zero values as no usage.
  repeated UsageAnalyticsCoverage coverage = 5;
  // Inclusive start of the window, in RFC 3339 format.
  google.protobuf.Timestamp period_start = 1;
  // Exclusive end of the window, in RFC 3339 format.
  google.protobuf.Timestamp period_end = 2;
  // Totals for the whole window.
  OrganizationUsageTotals totals = 3;
  // One entry for each day in the window, in date order. Days without usage have zero values.
  repeated OrganizationUsageDay days = 4;
}

message ListContainerBuildUsageByProjectRequest {
  // Time window to report. To see one day, set the window to that UTC day.
  UsageAnalyticsTimeRange time_range = 1;
  // Number of rows to return per page. Maximum: 500. Default: 100.
  int32 page_size = 2;
  // Token to fetch the next page. Use the same filters and `timeRange` as the request that returned it, or leave `timeRange`
  // unset to keep that window. Leave empty to fetch the first page.
  string page_token = 3;
  // An array of project IDs. Leave empty to include all projects. Maximum: 100 values.
  repeated string project_ids = 4;

}

message ContainerBuildProjectUsage {
  // Unique identifier for the project.
  string project_id = 1;
  // Project name. Empty when the project was deleted.
  string project_name = 2;
  // Number of builds that finished in the window.
  int64 build_count = 3;
  // Total build duration, in seconds.
  double billable_seconds = 4;
  // Build time saved by cache hits, in seconds.
  double saved_seconds = 5;
  // Share of build steps that were cache hits, from 0 to 1.
  double cache_hit_rate = 6;
  // Share of builds that ended with an error, from 0 to 1.
  double error_rate = 7;
}

message ListContainerBuildUsageByProjectResponse {
  // Projects with builds in the window, ordered by billable time with the largest first.
  repeated ContainerBuildProjectUsage projects = 1;
  // Token to fetch the next page. Empty when there are no more rows.
  string next_page_token = 2;
}

message ListGithubActionsUsageByRepositoryRequest {
  // Time window to report. To see one day, set the window to that UTC day.
  UsageAnalyticsTimeRange time_range = 1;
  // Number of rows to return per page. Maximum: 500. Default: 100.
  int32 page_size = 2;
  // Token to fetch the next page. Use the same filters and `timeRange` as the request that returned it, or leave `timeRange`
  // unset to keep that window. Leave empty to fetch the first page.
  string page_token = 3;
  // An array of repositories in "owner/name" format. Leave empty to include all repositories. Maximum: 100 values.
  repeated string repositories = 4;

}

message GithubActionsRepositoryUsage {
  // Repository, in "owner/name" format. Usage recorded under an earlier name of a renamed repository is grouped under
  // the current name.
  string repository = 1;
  // Number of jobs that finished in the window.
  int64 job_count = 2;
  // Billable job time, in seconds.
  double billable_seconds = 3;
  // Elapsed job time, in seconds.
  double elapsed_seconds = 4;
  // Average elapsed time per job, in seconds.
  double average_job_seconds = 5;
  // Share of jobs that failed, from 0 to 1.
  double failure_rate = 6;
}

message ListGithubActionsUsageByRepositoryResponse {
  // Repositories with jobs in the window, ordered by billable time with the largest first.
  repeated GithubActionsRepositoryUsage repositories = 1;
  // Token to fetch the next page. Empty when there are no more rows.
  string next_page_token = 2;
}

message ListGithubActionsUsageByRunnerRequest {
  // Time window to report. To see one day, set the window to that UTC day.
  UsageAnalyticsTimeRange time_range = 1;
  // Number of rows to return per page. Maximum: 500. Default: 100.
  int32 page_size = 2;
  // Token to fetch the next page. Use the same filters and `timeRange` as the request that returned it, or leave `timeRange`
  // unset to keep that window. Leave empty to fetch the first page.
  string page_token = 3;
  // An array of repositories in "owner/name" format. Leave empty to include all repositories. Maximum: 100 values.
  repeated string repositories = 4;

}

message GithubActionsRunnerUsage {
  // Runner label the jobs requested. For example, "depot-ubuntu-24.04".
  string runner_label = 1;
  // Number of jobs that finished in the window.
  int64 job_count = 2;
  // Billable job time, in seconds.
  double billable_seconds = 3;
  // Elapsed job time, in seconds.
  double elapsed_seconds = 4;
}

message ListGithubActionsUsageByRunnerResponse {
  // Runner labels with jobs in the window, ordered by billable time with the largest first.
  repeated GithubActionsRunnerUsage runners = 1;
  // Token to fetch the next page. Empty when there are no more rows.
  string next_page_token = 2;
}

message ListGithubActionsUsageByJobRequest {
  // Time window to report. To see one day, set the window to that UTC day.
  UsageAnalyticsTimeRange time_range = 1;
  // Number of rows to return per page. Maximum: 500. Default: 100.
  int32 page_size = 2;
  // Token to fetch the next page. Use the same filters and `timeRange` as the request that returned it, or leave `timeRange`
  // unset to keep that window. Leave empty to fetch the first page.
  string page_token = 3;
  // An array of repositories in "owner/name" format. Leave empty to include all repositories. Maximum: 100 values.
  repeated string repositories = 4;

  // An array of workflow file paths. Leave empty to include all workflows; use an empty string to select unattributed usage. Maximum: 100 values.
  repeated string workflow_paths = 5;

}

message GithubActionsJobNameUsage {
  // Recorded workflow file path. Empty when unavailable; these rows remain separate from attributed usage.
  // Use the repository and this path together to identify a workflow, rather than its display name or job name.
  string workflow_path = 9;
  // Repository, in "owner/name" format. Usage recorded under an earlier name of a renamed repository is grouped under
  // the current name.
  string repository = 1;
  // Workflow name. Empty when GitHub did not report one.
  string workflow_name = 2;
  // Job name as reported by GitHub. The Depot usage page shows this value in its workflow column.
  string job_name = 3;
  // Number of jobs that finished in the window.
  int64 job_count = 4;
  // Billable job time, in seconds.
  double billable_seconds = 5;
  // Elapsed job time, in seconds.
  double elapsed_seconds = 6;
  // Average elapsed time per job, in seconds.
  double average_job_seconds = 7;
  // Share of jobs that failed, from 0 to 1.
  double failure_rate = 8;
}

message ListGithubActionsUsageByJobResponse {
  // Jobs with usage in the window, ordered by billable time with the largest first.
  repeated GithubActionsJobNameUsage jobs = 1;
  // Token to fetch the next page. Empty when there are no more rows.
  string next_page_token = 2;
}

message ListDepotCIUsageByRepositoryRequest {
  // Time window to report. To see one day, set the window to that UTC day. Usage before May 22, 2026 is not available.
  UsageAnalyticsTimeRange time_range = 1;
  // Number of rows to return per page. Maximum: 500. Default: 100.
  int32 page_size = 2;
  // Token to fetch the next page. Use the same filters and `timeRange` as the request that returned it, or leave `timeRange`
  // unset to keep that window. Leave empty to fetch the first page.
  string page_token = 3;
  // An array of recorded repository names in "owner/name" format. Leave empty to include all repositories. Maximum: 100 values.
  repeated string repositories = 4;

}

message DepotCIRepositoryUsage {
  // Repository, in "owner/name" format.
  string repository = 1;
  // Number of job attempts that finished in the window.
  int64 attempt_count = 2;
  // Compute time used, in vCPU-seconds.
  double vcpu_seconds = 3;
  // Elapsed attempt time, in seconds.
  double elapsed_seconds = 4;
  // Average elapsed time per attempt, in seconds.
  double average_attempt_seconds = 5;
  // Share of attempts with the "failure" outcome, from 0 to 1.
  double failure_rate = 6;
}

message ListDepotCIUsageByRepositoryResponse {
  // Repositories with attempts in the window, ordered by compute time with the largest first.
  repeated DepotCIRepositoryUsage repositories = 1;
  // Token to fetch the next page. Empty when there are no more rows.
  string next_page_token = 2;
}

message ListDepotCIUsageByWorkflowRequest {
  // Time window to report. To see one day, set the window to that UTC day. Usage before May 22, 2026 is not available.
  UsageAnalyticsTimeRange time_range = 1;
  // Number of rows to return per page. Maximum: 500. Default: 100.
  int32 page_size = 2;
  // Token to fetch the next page. Use the same filters and `timeRange` as the request that returned it, or leave `timeRange`
  // unset to keep that window. Leave empty to fetch the first page.
  string page_token = 3;
  // An array of recorded repository names in "owner/name" format. Leave empty to include all repositories. Maximum: 100 values.
  repeated string repositories = 4;

  // An array of workflow keys returned by this method. Leave empty to include all workflows; use an empty string to select unattributed usage. Maximum: 100 values.
  repeated string workflow_keys = 5;

}

message DepotCIWorkflowUsage {
  // Repository, in "owner/name" format.
  string repository = 1;
  // Stable key for the workflow within the repository.
  string workflow_key = 2;
  // Unique identifier for the most recent workflow with this key in the window. Use it with `GetWorkflow`.
  string workflow_id = 3;
  // Name of the most recent workflow with this key in the window.
  string workflow_name = 4;
  // Workflow file path of the most recent workflow with this key in the window. For example, ".depot/workflows/ci.yml".
  // Empty when the workflow has no file path.
  string workflow_path = 5;
  // Number of job attempts that finished in the window.
  int64 attempt_count = 6;
  // Compute time used, in vCPU-seconds.
  double vcpu_seconds = 7;
  // Elapsed attempt time, in seconds.
  double elapsed_seconds = 8;
  // Average elapsed time per attempt, in seconds.
  double average_attempt_seconds = 9;
  // Share of attempts with the "failure" outcome, from 0 to 1.
  double failure_rate = 10;
}

message ListDepotCIUsageByWorkflowResponse {
  // Workflows with attempts in the window, ordered by compute time with the largest first.
  repeated DepotCIWorkflowUsage workflows = 1;
  // Token to fetch the next page. Empty when there are no more rows.
  string next_page_token = 2;
}

message ListTestResultsUsageByRepositoryRequest {
  // Time window to report. Usage before July 22, 2026 is not available.
  UsageAnalyticsTimeRange time_range = 1;
  // Number of rows to return per page. Maximum: 500. Default: 100.
  int32 page_size = 2;
  // Token to fetch the next page. Use the same filters and `timeRange` as the request that returned it, or leave `timeRange`
  // unset to keep that window. Leave empty to fetch the first page.
  string page_token = 3;
  // An array of repositories in "owner/name" format. Leave empty to include all repositories; use an empty string to select unattributed usage. Maximum: 100 values.
  repeated string repositories = 4;

}

message TestResultsRepositoryUsage {
  // Repository, in "owner/name" format. Empty when the reports did not name a repository.
  string repository = 1;
  // Number of test reports received in the window.
  int64 report_count = 2;
  // Number of tests in those reports.
  int64 test_count = 3;
  // Number of billable tests. Tests received before August 1, 2026 are never billable.
  int64 billable_test_count = 4;
}

message ListTestResultsUsageByRepositoryResponse {
  // Repositories with test reports in the window, ordered by billable tests with the largest first.
  repeated TestResultsRepositoryUsage repositories = 1;
  // Token to fetch the next page. Empty when there are no more rows.
  string next_page_token = 2;
}

message GetUsageReportRequest {
  // Report window. Default: the current calendar month in UTC up to the current time.
  UsageAnalyticsTimeRange time_range = 1;
}

message UsageReportContainerBuildRow {
  // Project name.
  string project_name = 1;
  // Number of builds that finished in the window.
  int64 build_count = 2;
  // Build time saved by cache hits, in minutes, rounded to two decimal places.
  double minutes_saved = 3;
  // Billable build time, in minutes, rounded to two decimal places.
  double minutes_billed = 4;
}

message UsageReportGithubActionsJobRow {
  // Repository, in "owner/name" format.
  string repository = 1;
  // Job name as reported by GitHub. The CSV export labels this column "workflow".
  string job_name = 2;
  // Runner label the jobs requested.
  string runner_label = 3;
  // Number of jobs that finished in the window.
  int64 job_count = 4;
  // Elapsed job time, in minutes, rounded to two decimal places.
  double minutes_elapsed = 5;
  // Billable job time, in minutes, rounded to two decimal places.
  double minutes_billed = 6;
}

message UsageReportStorageRow {
  // Storage type. Can be "Container Layer Cache" or "Remote Build Cache".
  string storage_type = 1;
  // Average storage used in the window, in GB, rounded to two decimal places.
  double total_gb = 2;
}

message UsageReportAgentSandboxRow {
  // Agent type. For example, "Claude Code".
  string agent_type = 1;
  // Number of sandbox compute records that finished in the window.
  int64 sandbox_count = 2;
  // Elapsed sandbox time, in minutes, rounded to two decimal places.
  double minutes_elapsed = 3;
  // Billable sandbox time, in minutes, rounded to two decimal places.
  double minutes_billed = 4;
}

message UsageReportTestResultsRow {
  // Source of the test reports. Can be "Depot CI" or "GitHub Actions".
  string source = 1;
  // Number of tests reported.
  int64 total_test_count = 2;
  // Number of billable tests. Tests received before August 1, 2026 are never billable.
  int64 billable_test_count = 3;
}

message GetUsageReportResponse {
  // Inclusive start of the report window, in RFC 3339 format.
  google.protobuf.Timestamp period_start = 1;
  // Exclusive end of the report window, in RFC 3339 format.
  google.protobuf.Timestamp period_end = 2;
  // Container build usage for each project with builds, ordered by project name. Maximum: 5000 rows.
  repeated UsageReportContainerBuildRow container_builds = 3;
  // True when `containerBuilds` was cut off at the maximum row count.
  bool container_builds_truncated = 4;
  // GitHub Actions job usage for each repository, job name, and runner label, in that order. Maximum: 5000 rows.
  repeated UsageReportGithubActionsJobRow github_actions_jobs = 5;
  // True when `githubActionsJobs` was cut off at the maximum row count.
  bool github_actions_jobs_truncated = 6;
  // Average storage used, one row for each storage type. Depot Registry storage is not included.
  repeated UsageReportStorageRow storage = 7;
  // Agent sandbox usage for each agent type.
  repeated UsageReportAgentSandboxRow agent_sandboxes = 8;
  // Test results usage for each source. Empty when the window ends before July 22, 2026, when test results usage
  // tracking started.
  repeated UsageReportTestResultsRow test_results = 9;
}

message GetAgentSandboxUsageRequest {
  // Time window for daily compute time and recent sessions.
  UsageAnalyticsTimeRange time_range = 1;
}

message AgentSandboxComputeDay {
  // Calendar day in UTC, in "YYYY-MM-DD" format.
  string date = 1;
  // True when the day has not ended yet or is only partly inside the window.
  bool partial = 2;
  // Claude Code sandbox compute time that finished on this day, in minutes.
  double compute_minutes = 3;
}

message AgentSandboxSessionDuration {
  // Unique identifier for the agent session.
  string session_id = 1;
  // Time the sandbox was created, in RFC 3339 format.
  google.protobuf.Timestamp created_at = 2;
  // Time the sandbox completed, in RFC 3339 format.
  google.protobuf.Timestamp completed_at = 3;
  // Sandbox duration, in seconds, rounded to the nearest second.
  int64 duration_seconds = 4;
  // True when the sandbox session failed.
  bool failed = 5;
}

message GetAgentSandboxUsageResponse {
  // Inclusive start of the window, in RFC 3339 format.
  google.protobuf.Timestamp period_start = 1;
  // Exclusive end of the window, in RFC 3339 format.
  google.protobuf.Timestamp period_end = 2;
  // One entry for each day in the window, in date order. Days without usage have zero values.
  repeated AgentSandboxComputeDay days = 3;
  // Number of Claude Code agent sessions that have a sandbox running now. This value does not depend on `timeRange`.
  int64 running_session_count = 4;
  // An array of the most recent Claude Code sandboxes that completed in the window, newest first. Maximum: 30.
  repeated AgentSandboxSessionDuration recent_sessions = 5;
}

message GetCurrentPeriodUsageRequest {}

message GetCurrentPeriodUsageResponse {
  // Start of the organization's current usage period, in RFC 3339 format. When the organization has no usage period,
  // this is the start of the current calendar month in UTC.
  google.protobuf.Timestamp period_start = 1;
  // Exclusive end of the organization's current usage period, in RFC 3339 format. When the organization has no usage
  // period, this is the start of the next calendar month in UTC.
  google.protobuf.Timestamp period_end = 2;
  // Average daily layer cache storage across the days in the period that have started, rounded to whole GB.
  int64 layer_cache_gb = 3;
  // Average remote build cache storage in the period, rounded down to whole GB.
  int64 remote_build_cache_gb = 4;
  // Container build time recorded since the period started, rounded down to whole minutes.
  int64 build_minutes = 5;
  // GitHub Actions runner time recorded since the period started, rounded down to whole billable minutes. Dedicated
  // hosts are not included.
  int64 github_actions_minutes = 6;
  // Depot sandbox compute time recorded since the period started, rounded down to whole billable minutes. Includes
  // Depot CI jobs and every other Depot sandbox the organization ran, such as SDK sandboxes and agent sandboxes.
  int64 sandbox_minutes = 7;
}

// Availability of recorded usage for one selected product. Store failures fail the request instead of reporting zero.
message UsageAnalyticsCoverage {
  // Product selected in the request.
  string product = 1;
  // Earliest supported usage timestamp. Omitted when there is no fixed tracking start date.
  google.protobuf.Timestamp available_from = 2;
  // True when the entire requested window predates tracking. Zero values in that window mean unavailable.
  bool unavailable = 3;
  // True when part of the requested window predates tracking.
  bool partial_history = 4;
  // Attribution, freshness, and population limitations.
  string note = 5;
}
