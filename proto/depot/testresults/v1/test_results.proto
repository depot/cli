syntax = "proto3";

package depot.testresults.v1;

import "google/api/visibility.proto";

option go_package = "github.com/depot/api/proto/depot/testresults/v1;testresultsv1";

// TestResultsService ingests and exposes normalized test-result reports.
// Ingest methods derive owner identity from auth. Read methods verify the
// requested owner belongs to the authenticated org before returning results.
service TestResultsService {
  // ReportTestResults ingests one or more gzipped JUnit XML files for the
  // authenticated execution owner and invocation.
  rpc ReportTestResults(ReportTestResultsRequest) returns (ReportTestResultsResponse) {
    option (google.api.method_visibility).restriction = "INTERNAL";
  }

  // SplitTests returns the runnable candidates assigned to one shard.
  rpc SplitTests(SplitTestsRequest) returns (SplitTestsResponse) {
    option (google.api.method_visibility).restriction = "INTERNAL";
  }

  // ListTestResults returns parsed test case results for one verified CI or
  // GitHub Actions owner.
  rpc ListTestResults(ListTestResultsRequest) returns (ListTestResultsResponse) {}

  // Lists cross-run flaky or slow tests for the authenticated organization.
  // Requires an organization API token or a user token with organization membership.
  rpc ListTestAnalytics(ListTestAnalyticsRequest) returns (ListTestAnalyticsResponse) {}
}

enum TestAnalyticsRanking {
  TEST_ANALYTICS_RANKING_UNSPECIFIED = 0;
  TEST_ANALYTICS_RANKING_FLAKY = 1;
  TEST_ANALYTICS_RANKING_SLOWEST = 2;
}

message ListTestAnalyticsRequest {
  // Ranking to return. Flaky tests have passing and failing or errored executions
  // for the same repository, ref, and commit. Slow tests rank by p95 duration.
  // Default: TEST_ANALYTICS_RANKING_FLAKY.
  TestAnalyticsRanking ranking = 1;
  // First UTC calendar date to include, in YYYY-MM-DD format. Maximum range: 90 days.
  // Default: six days before `endDate`.
  string start_date = 2;
  // Last UTC calendar date to include, in YYYY-MM-DD format. Default: today.
  string end_date = 3;
  // Result source to include. Leave unspecified to include Depot CI and GitHub Actions.
  TestResultsOwnerType owner_type = 4;
  // Exact repository identity recorded with the report. Leave empty to include all repositories.
  string repo = 5;
  // Exact source ref. For example, "refs/heads/main". Leave empty to include all refs.
  string ref = 6;
  // Exact representative suite name for each test identity. Leave empty to include all suites.
  string suite_name = 7;
  // Case-insensitive substring of the representative test name. Leave empty to include all tests.
  string test_name = 8;
  // Exact representative class name. Leave empty to include all classes.
  string class_name = 9;
  // Exact representative filename. Leave empty to include all files.
  string file_name = 10;
  // Number of ranked tests to return. Maximum: 100. Default: 20.
  uint32 limit = 11;
}

message ListTestAnalyticsResponse {
  // Effective first UTC calendar date, in YYYY-MM-DD format.
  string start_date = 1;
  // Effective last UTC calendar date, in YYYY-MM-DD format.
  string end_date = 2;
  // Applied ranking.
  TestAnalyticsRanking ranking = 3;
  // Tests grouped separately by source, repository, and test identity.
  repeated TestAnalytics tests = 4;
  // Whether more matching tests exist. Increase `limit` or narrow the filters to explore them.
  bool has_more = 5;
}

// Labels for flaky rankings come from the qualifying revision group with the most
// recent pass. Labels for slow rankings come from the latest selected result.
message TestAnalytics {
  // Stable test identity within `ownerType` and `repo`.
  string test_identity_key = 1;
  // Source of these results.
  TestResultsOwnerType owner_type = 2;
  // Repository identity recorded with the reports. Empty for reports without repository context.
  string repo = 3;
  // Representative suite name.
  string suite_name = 4;
  // Representative test name.
  string test_name = 5;
  // Representative class name.
  string class_name = 6;
  // Representative filename.
  string file_name = 7;
  // Number of reported test results. For flaky rankings, includes only revision groups
  // with passing and failing or errored executions; skipped and unknown results are excluded.
  uint64 total = 8;
  // Number of passing results included in `total`.
  uint64 passed = 9;
  // Number of failing results included in `total`.
  uint64 failed = 10;
  // Number of errored results included in `total`.
  uint64 errored = 11;
  // Approximate 95th percentile of positive durations, in milliseconds. Present for slow rankings.
  optional double p95_duration_ms = 12;
  // Failed and errored results divided by `total`, from 0 to 1. Present for flaky rankings.
  optional double flake_rate = 13;
  // Number of repository/ref/commit groups with mixed outcomes across distinct executions.
  // Flaky rankings sort by this count, then the most recent pass. Zero for slow rankings.
  uint64 flaky_revisions = 14;
  // Latest failed or errored result for this test in the selected date and source filters.
  // Unset when no sample is available. Message, type and stack text are limited to 8 KiB each;
  // stdout and stderr are omitted. Use its owner and test fields with `ListTestResults` for more context.
  TestResult latest_failure = 15;
}

enum TestResultsOwnerType {
  TEST_RESULTS_OWNER_TYPE_UNSPECIFIED = 0;
  TEST_RESULTS_OWNER_TYPE_CI = 1;
  TEST_RESULTS_OWNER_TYPE_GITHUB_ACTIONS = 2;
}

enum TestResultStatus {
  TEST_RESULT_STATUS_UNSPECIFIED = 0;
  TEST_RESULT_STATUS_UNKNOWN = 1;
  TEST_RESULT_STATUS_PASSED = 2;
  TEST_RESULT_STATUS_FAILED = 3;
  TEST_RESULT_STATUS_ERRORED = 4;
  TEST_RESULT_STATUS_SKIPPED = 5;
}

enum TestTimingIdentity {
  // Unknown timing identity.
  TEST_TIMING_IDENTITY_UNSPECIFIED = 0;
  // Use the JUnit file identity.
  TEST_TIMING_IDENTITY_FILENAME = 1;
  // Use the JUnit class identity.
  TEST_TIMING_IDENTITY_CLASSNAME = 2;
  // Use the JUnit test name identity.
  TEST_TIMING_IDENTITY_TESTNAME = 3;
}

enum TestCandidateIdentity {
  // Unknown candidate identity.
  TEST_CANDIDATE_IDENTITY_UNSPECIFIED = 0;
  // Runnable candidates are file paths.
  TEST_CANDIDATE_IDENTITY_FILENAME = 1;
  // Runnable candidates are JUnit class names.
  TEST_CANDIDATE_IDENTITY_CLASSNAME = 2;
}

message ReportTestResultsRequest {
  // Per-step identity key that scopes multiple reports within a single owner.
  // Must be non-empty.
  string invocation_id = 1;

  // One entry per JUnit XML file included in the report.
  repeated TestResultsFile files = 2;
}

message TestResultsFile {
  // Relative filename for this JUnit XML file (telemetry/debugging only).
  string filename = 1;
  // gzip-compressed JUnit XML bytes. This must be a gzip stream, not a zip
  // archive containing multiple XML files.
  bytes gzipped_xml = 2;
}

message ReportTestResultsResponse {
  // Count of files successfully gunzipped and parsed.
  uint32 files_processed = 1;
  // Total <testcase> rows parsed from accepted JUnit XML files.
  uint32 tests_reported = 2;
  // Whether this invocation was previously reported. Currently always false.
  bool duplicate_invocation = 3;
  // Count of files skipped because they could not be gunzipped, parsed as
  // recognizable JUnit XML, or accepted within the request resource budget.
  uint32 files_skipped = 4;
}

message SplitTestsRequest {
  // An array of runnable test candidates to split. Each value should be
  // something the caller's test command can execute, such as a test file path
  // or a JUnit class name. Blank values are ignored. Duplicate values may be
  // collapsed after applying `candidateIdentity`; file path separators are
  // treated equivalently. Maximum: 10000 candidates, 4096 bytes per candidate,
  // and 524288 total candidate bytes. Every shard request for the same
  // authenticated execution, `splitKey`, `shardTotal`, `candidateIdentity`, and
  // `timingIdentity` must send the same candidate set; changing it returns
  // FailedPrecondition.
  repeated string candidates = 1;

  // Candidate identity used by `candidates`. Required when `timingIdentity` is
  // `TEST_TIMING_IDENTITY_TESTNAME`. Default: `timingIdentity` when it is
  // `TEST_TIMING_IDENTITY_FILENAME` or `TEST_TIMING_IDENTITY_CLASSNAME`;
  // otherwise `TEST_CANDIDATE_IDENTITY_FILENAME`.
  TestCandidateIdentity candidate_identity = 2;

  // JUnit identity used to weight candidates with historical timings. Default:
  // `candidateIdentity`.
  TestTimingIdentity timing_identity = 3;

  // Zero-based shard index to return. Must be less than `shardTotal`.
  uint32 shard_index = 4;

  // Total number of shards in the test run. Must be greater than zero. Maximum:
  // 10000.
  uint32 shard_total = 5;

  // Per-test-command identity key. Use a distinct value when one job performs
  // more than one independent test split. Maximum: 16384 bytes. Default:
  // "default".
  string split_key = 6;
}

message SplitTestsResponse {
  // Runnable candidates assigned to the requested shard. Values are selected
  // from `candidates` after trimming blank space.
  repeated string candidates = 1;

  // Number of candidate values received in the request.
  uint32 candidates_requested = 2;

  // Number of candidates assigned to the requested shard.
  uint32 candidates_selected = 3;

  // Number of normalized candidates with historical timing data.
  uint32 candidates_with_timings = 4;
}

message ListTestResultsRequest {
  // Backend that owns `ownerId`. Leave unspecified to infer it from `ownerId`.
  TestResultsOwnerType owner_type = 1;

  // Unique identifier for the owner to read. When `ownerType` is
  // `TEST_RESULTS_OWNER_TYPE_CI`, this must be a CI attempt ID. When
  // `ownerType` is `TEST_RESULTS_OWNER_TYPE_GITHUB_ACTIONS`, this must be the
  // GitHub job ID. When `ownerType` is unspecified, this can be a CI attempt ID
  // or GitHub job ID.
  // Required.
  string owner_id = 2;

  // An array of test statuses to include. Leave empty to include every status.
  repeated TestResultStatus status = 3;

  // Test suite name to include. Leave empty to include every suite.
  string suite_name = 4;

  // Case-insensitive test case name substring to include. Leave empty to
  // include every test.
  string test_name = 5;

  // Test class name to include. Leave empty to include every class.
  string class_name = 6;

  // Source filename to include. Leave empty to include every file.
  string file_name = 7;

  // Number of results to return per page. Maximum: 500. Default: 100.
  uint32 page_size = 8;

  // Token to fetch the next page. Leave empty to fetch the first page.
  string page_token = 9;
}

message ListTestResultsResponse {
  // Owner type selected after resolving the request.
  TestResultsOwnerType owner_type = 1;

  // Concrete owner identifier included in this response.
  string owner_id = 2;

  // Test result rows in deterministic page order.
  repeated TestResult results = 3;

  // Token to fetch the next page. Empty when there are no more results.
  string next_page_token = 4;
}

message TestResult {
  // Backend owner type for this result.
  TestResultsOwnerType owner_type = 1;

  // Unique identifier for the concrete owner that reported this result.
  string owner_id = 2;

  // Invocation identifier supplied with the report.
  string invocation_id = 3;

  // Test suite name from the parsed JUnit XML.
  string suite_name = 4;

  // Test case name from the parsed JUnit XML.
  string test_name = 5;

  // Test class name from the parsed JUnit XML.
  string class_name = 6;

  // Source filename from the parsed JUnit XML. Empty when the report omitted
  // it.
  string file_name = 7;

  // Source line number from the parsed JUnit XML. Zero when the report omitted
  // it.
  uint32 line_number = 8;

  // Parsed status for this test case.
  TestResultStatus status = 9;

  // Test case duration in milliseconds.
  uint32 duration_ms = 10;

  // Failure message from the parsed JUnit XML. Empty for non-failing tests or
  // when the report omitted it.
  string failure_message = 11;

  // Failure type from the parsed JUnit XML. Empty for non-failing tests or
  // when the report omitted it.
  string failure_type = 12;

  // Stack trace from the parsed JUnit XML. Empty for non-failing tests or when
  // the report omitted it.
  string stack_trace = 13;

  // Captured standard output for this test case. Empty when the report omitted
  // it.
  string system_out = 14;

  // Captured standard error for this test case. Empty when the report omitted
  // it.
  string system_err = 15;

  // Result timestamp, in RFC 3339 format.
  string timestamp = 16;
}
