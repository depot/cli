name: gocache-windows
on:
  workflow_dispatch:
  push:
    branches: [windows-cache-test]

jobs:
  unit:
    runs-on: depot-windows-2025-4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          check-latest: false
          cache: true
      - run: go test -count=1 -v ./pkg/cmd/gocache/

  e2e:
    runs-on: depot-windows-2025-4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          check-latest: false
          cache: true

      - name: Show where GOCACHEPROG comes from
        shell: pwsh
        run: |
          Get-Command go -All | Format-Table CommandType, Source
          "process env: $env:GOCACHEPROG"
          "machine env: $([Environment]::GetEnvironmentVariable('GOCACHEPROG', 'Machine'))"
          "user env:    $([Environment]::GetEnvironmentVariable('GOCACHEPROG', 'User'))"
          go env GOENV GOROOT GOCACHEPROG
          $goenv = go env GOENV
          if (Test-Path $goenv) { "--- $goenv"; Get-Content $goenv }
          $rootenv = Join-Path (go env GOROOT) go.env
          if (Test-Path $rootenv) { "--- $rootenv"; Get-Content $rootenv }

      - name: Fill the remote cache
        run: go vet ./cmd/... ./pkg/...

      - name: Remote hits with concurrent vet readers
        shell: pwsh
        run: |
          for ($i = 1; $i -le 10; $i++) {
            Remove-Item -Recurse -Force (go env GOCACHE)
            go vet ./cmd/... ./pkg/...
            if ($LASTEXITCODE -ne 0) { throw "run $i failed" }
          }
